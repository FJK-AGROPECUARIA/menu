<title>FJK · Menu Principal</title>
<style>
:root{--bg:#f4f6f8;--fg:#11253d;--muted:#5d6b7a;--lima:#a9c41c;--body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html,body{overscroll-behavior-y:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4}
.topo{background:linear-gradient(135deg,#0b1a2c 0%,#1d3a5c 100%);color:#fff;border-radius:0 0 20px 20px;padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px))}
.topoLinha{display:flex;align-items:center;gap:8px;min-height:clamp(80px,24vw,130px)}
.topoLogo{height:clamp(56px,16vw,96px);width:auto;flex:none}
.topoTxt{flex:1;min-width:0;position:relative;padding-left:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;align-self:stretch}
.topoTxt::before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:2px;border-radius:2px;background:var(--lima);opacity:.85}
.topoTxt h1{margin:0;color:#fff;font-size:clamp(15px,4.6vw,26px);letter-spacing:.04em;font-weight:800;line-height:1.2}
.topoTxt .sub{font-size:12.5px;margin-top:3px;color:#cfe0f2}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.tiles{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tiles a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:132px;padding:12px 8px;border-radius:18px;background:var(--c);color:#fff;text-decoration:none;font-size:1.2rem;font-weight:800;line-height:1.15;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.12);-webkit-tap-highlight-color:transparent}
.tiles a:active{transform:scale(.97)}
.tiles a.full{grid-column:1/-1}
.tiles .gIc{font-size:2.4rem;line-height:1}
.tiles small{font-size:.75rem;font-weight:600;opacity:.9}
.nota{color:var(--muted);font-size:.85rem;text-align:center;margin-top:16px}
</style>
</head>
